<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarifa 2027 · Orquesta Princes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#07030f; --ink:#f4f0ff; --soft:#a99bc9;
  --line:rgba(178,140,255,.20); --line2:rgba(178,140,255,.40);
  --purple:#9B4FE0; --violet:#7B3FC4; --teal:#2ED9C3; --cyan:#4FC3F7; --pink:#FF6EC7;
  --t0:#5d6f96; --t1:#4FC3F7; --t2:#2ED9C3; --t3:#A46BE8; --t4:#E84FB0; --t5:#FF6EC7;
  --font:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--deep)}
body{background:var(--deep); color:var(--ink); font-family:var(--font); min-height:100vh;
  -webkit-font-smoothing:antialiased; overflow-x:hidden}
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(80vw 60vh at 15% 8%,  rgba(155,79,224,.30), transparent 65%),
    radial-gradient(70vw 55vh at 88% 22%, rgba(46,217,195,.20), transparent 65%),
    radial-gradient(90vw 70vh at 50% 105%, rgba(232,79,176,.22), transparent 70%);
}
body::after{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 34% 62%, #bff, transparent),
    radial-gradient(1.6px 1.6px at 58% 12%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 72% 48%, #fdf, transparent),
    radial-gradient(1.4px 1.4px at 88% 76%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 22% 88%, #cff, transparent),
    radial-gradient(1.3px 1.3px at 46% 34%, #fff, transparent),
    radial-gradient(1.1px 1.1px at 92% 28%, #fbf, transparent);
  animation:twinkle 5s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.25}to{opacity:.7}}
.wrap{position:relative; z-index:1; max-width:1600px; margin:0 auto; padding:0 clamp(8px,2vw,28px) 48px}

.banner{
  position:relative; margin:0 calc(-1*clamp(8px,2vw,28px)) clamp(10px,2vw,20px);
  height:clamp(150px,34vw,330px); overflow:hidden;
  opacity:0; animation:fade 1.1s .05s ease forwards;
}
.banner img{width:100%; height:100%; object-fit:cover; object-position:center 42%; display:block}
.banner::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(to bottom, rgba(7,3,15,.15) 0%, rgba(7,3,15,.05) 45%, rgba(7,3,15,.75) 82%, var(--deep) 100%);
}
.banner .tag{position:absolute; left:0; right:0; bottom:clamp(6px,1.4vw,16px); z-index:2; text-align:center}
.banner .tag .yr{
  font-family:var(--mono); font-weight:800; font-size:clamp(30px,10vw,76px); line-height:.9;
  background:linear-gradient(105deg,var(--purple) 0%,var(--cyan) 42%,var(--teal) 70%,var(--pink) 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 18px rgba(155,79,224,.55)); letter-spacing:-.04em;
}
.banner .tag .lb{
  font-size:clamp(9px,2.3vw,13px); letter-spacing:.34em; text-transform:uppercase;
  color:var(--soft); font-weight:600; margin-top:2px;
}

.panel{
  background:linear-gradient(145deg, rgba(155,79,224,.14), rgba(46,217,195,.07));
  border:1px solid var(--line); border-radius:18px;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  padding:clamp(12px,2vw,18px); margin-bottom:clamp(10px,1.8vw,18px);
  box-shadow:0 0 0 1px rgba(255,255,255,.03) inset, 0 18px 50px -24px rgba(155,79,224,.5);
  display:flex; gap:clamp(10px,2vw,20px); align-items:center; flex-wrap:wrap;
  opacity:0; animation:rise .8s .18s cubic-bezier(.2,.7,.2,1) forwards;
}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(8px,2vw,22px); flex:1 1 220px}
.stat{display:flex; flex-direction:column; gap:2px; min-width:0}
.stat .k{font-size:8.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--soft);
  font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.stat .v{font-family:var(--mono); font-weight:800; font-size:clamp(14px,3.6vw,22px);
  letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.stat:nth-child(1) .v{color:var(--cyan)}
.stat:nth-child(2) .v{color:var(--teal)}
.stat:nth-child(3) .v{color:var(--pink)}
#pdf{
  font-family:var(--font); font-size:12px; font-weight:700; letter-spacing:.02em;
  padding:11px 18px; border-radius:99px; border:none; cursor:pointer; flex:none;
  background:linear-gradient(100deg,var(--violet),var(--purple) 55%,var(--pink));
  color:#fff; box-shadow:0 0 20px rgba(155,79,224,.5);
  transition:transform .16s cubic-bezier(.2,.7,.2,1), box-shadow .16s;
  display:inline-flex; align-items:center; gap:7px;
}
#pdf:hover{transform:translateY(-2px); box-shadow:0 0 28px rgba(232,79,176,.7)}
#pdf:active{transform:translateY(0)}

.legend{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:clamp(10px,1.6vw,16px);
  opacity:0; animation:rise .8s .26s cubic-bezier(.2,.7,.2,1) forwards}
.lg{display:flex; align-items:center; gap:5px; font-size:10.5px; font-weight:600; color:var(--soft);
  background:rgba(178,140,255,.07); border:1px solid var(--line); border-radius:99px;
  padding:4px 10px 4px 6px; cursor:pointer; transition:all .18s; white-space:nowrap}
.lg:hover{color:var(--ink); border-color:var(--line2)}
.lg.off{opacity:.3}
.lg .dot{width:9px; height:9px; border-radius:50%; flex:none; box-shadow:0 0 8px currentColor}

.grid{display:grid; gap:clamp(7px,1.2vw,14px); grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
.month{
  background:linear-gradient(160deg, rgba(155,79,224,.13), rgba(18,10,36,.55));
  border:1px solid var(--line); border-radius:14px; padding:8px 7px 9px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:0 12px 30px -18px rgba(0,0,0,.9);
  opacity:0; transform:translateY(14px) scale(.98);
  animation:rise .65s cubic-bezier(.2,.7,.2,1) forwards;
}
.month h2{
  font-size:10px; letter-spacing:.15em; text-transform:uppercase; font-weight:800;
  display:flex; justify-content:space-between; align-items:baseline; gap:5px;
  padding:0 3px 7px; margin-bottom:6px; border-bottom:1px solid var(--line);
  background:linear-gradient(100deg,var(--teal),var(--cyan) 60%,var(--purple));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.month h2 .mt{font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:0;
  -webkit-text-fill-color:var(--soft); text-transform:none}
.dows{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:3px}
.dows span{font-size:8px; font-weight:700; text-align:center; color:var(--soft); letter-spacing:.04em}
.dows span.we{color:var(--teal)}
.cells{display:grid; grid-template-columns:repeat(7,1fr); gap:2px}
.cell{aspect-ratio:1/1; border-radius:5px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; position:relative; border:1px solid transparent;
  transition:transform .14s cubic-bezier(.2,.7,.2,1), box-shadow .14s}
.cell.pad{background:transparent}
.cell.on{background:color-mix(in srgb, var(--c) 17%, transparent);
  border-color:color-mix(in srgb, var(--c) 42%, transparent)}
.cell.on:hover{transform:scale(1.22); z-index:5; box-shadow:0 0 0 1px var(--c), 0 6px 18px rgba(0,0,0,.6)}
.cell .d{font-family:var(--mono); font-size:7.5px; font-weight:700; color:var(--soft); line-height:1; opacity:.85}
.cell .v{font-family:var(--mono); font-size:10.5px; font-weight:800; line-height:1.15;
  color:var(--c); letter-spacing:-.04em}
.cell .vp{display:none}
.cell.we .d{color:var(--ink); opacity:1}
.cell.hi{box-shadow:0 0 12px -2px var(--c)}
.cell.fix::before{content:''; position:absolute; top:2px; right:2px; width:3.5px; height:3.5px;
  border-radius:50%; background:#fff; box-shadow:0 0 5px #fff}
.cell.dim{opacity:.13}

footer{margin-top:clamp(16px,2.4vw,30px); padding-top:14px; border-top:1px solid var(--line);
  color:var(--soft); font-size:10.5px; display:flex; flex-wrap:wrap; gap:5px 16px; align-items:center}
footer b{color:var(--ink); font-weight:700}
footer .mk{display:inline-block; width:5px; height:5px; border-radius:50%; background:#fff;
  box-shadow:0 0 6px #fff; margin-right:5px; vertical-align:middle}

.phead{display:none}

@keyframes rise{to{opacity:1; transform:none}}
@keyframes fade{to{opacity:1}}
@media (max-width:420px){
  .stats{gap:8px}
  .grid{grid-template-columns:repeat(2,1fr); gap:7px}
  .cell .v{font-size:9.5px}
  .cell .d{font-size:7px}
  #pdf{width:100%; justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s !important; animation-delay:0s !important; transition:none !important}
  body::after{animation:none}
}

/* ============ VERSIÓN IMPRIMIBLE / PDF ============ */
@media print{
  @page{ size:A4 landscape; margin:9mm 10mm; }
  html,body{background:#fff !important; color:#14101f !important}
  body::before, body::after{display:none !important}
  .banner, .panel, .legend, footer, #pdf{display:none !important}
  .wrap{max-width:none; padding:0; margin:0}
  *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;
     animation:none !important; opacity:1 !important; transform:none !important; box-shadow:none !important}

  .phead{
    display:flex !important; justify-content:space-between; align-items:flex-end;
    border-bottom:1.6pt solid #7B3FC4; padding-bottom:2.5mm; margin-bottom:4mm;
  }
  .phead .l .nm{font-size:16pt; font-weight:800; color:#7B3FC4; letter-spacing:-.01em; line-height:1}
  .phead .l .sb{font-size:7.5pt; letter-spacing:.24em; text-transform:uppercase; color:#6b6288; margin-top:1.2mm}
  .phead .r{text-align:right}
  .phead .r .yy{font-family:var(--mono); font-size:26pt; font-weight:800; color:#14101f; line-height:.85; letter-spacing:-.03em}
  .phead .r .tt{font-size:7pt; letter-spacing:.2em; text-transform:uppercase; color:#6b6288; margin-top:.8mm}

  .grid{display:grid !important; grid-template-columns:repeat(3,1fr) !important; gap:4mm !important}
  .month{
    background:#fff !important; border:.7pt solid #d9d2ea !important; border-radius:2mm !important;
    padding:2mm 2mm 2.4mm !important; break-inside:avoid; page-break-inside:avoid;
    backdrop-filter:none !important;
  }
  .month:nth-of-type(6){break-after:page; page-break-after:always}
  .month h2{
    font-size:8.5pt !important; font-weight:800 !important; color:#7B3FC4 !important;
    -webkit-text-fill-color:#7B3FC4 !important; background:none !important;
    border-bottom:.6pt solid #e6e0f2 !important; padding-bottom:1.4mm !important; margin-bottom:1.4mm !important;
    letter-spacing:.08em !important;
  }
  .month h2 .mt{display:none !important}
  .dows span{font-size:5.6pt !important; color:#8b83a6 !important; font-weight:700 !important}
  .dows span.we{color:#1c8f82 !important}
  .cells{gap:.7mm !important}
  .cell{aspect-ratio:auto !important; min-height:7.4mm; border-radius:1mm !important; border:.5pt solid #ece7f6 !important}
  .cell.pad{border-color:transparent !important; background:none !important}
  .cell.on{background:#fbfaff !important}
  .cell .d{font-size:5.2pt !important; color:#9a93b0 !important; opacity:1 !important}
  .cell.we .d{color:#14101f !important}
  .cell .v{display:none !important}
  .cell .vp{
    display:block !important; font-family:var(--mono); font-size:6.4pt; font-weight:800;
    letter-spacing:-.02em; line-height:1.1; color:var(--pc);
  }
  .cell.dim{opacity:1 !important}
  .pfoot{
    display:flex !important; gap:6mm; flex-wrap:wrap; align-items:center;
    margin-top:3.5mm; padding-top:2mm; border-top:.6pt solid #e6e0f2;
    font-size:6.4pt; color:#6b6288;
  }
  .pfoot b{color:#14101f}
  .pfoot .sw{display:inline-block; width:2.4mm; height:2.4mm; border-radius:50%; margin-right:1mm; vertical-align:middle}
  .pleg{display:flex !important; gap:3.4mm; flex-wrap:wrap; align-items:center}
}
.pfoot{display:none}
</style>
</head>

const tramo = p => TRAMOS.findIndex(t => p <= t.max);
const mil = n => (n/1000).toFixed(1).replace('.', ',');
const eur = n => n.toLocaleString('es-ES') + ' €';
const miles = n => n.toLocaleString('es-ES');

const ocultos = new Set();

// leyenda de pantalla
const legend = document.getElementById('legend');
TRAMOS.forEach((t,i)=>{
  const el = document.createElement('div');
  el.className = 'lg';
  el.innerHTML = `<span class="dot" style="background:var(${t.v});color:var(${t.v})"></span>${t.t}`;
  el.onclick = () => { ocultos.has(i) ? ocultos.delete(i) : ocultos.add(i); el.classList.toggle('off');
    document.querySelectorAll('.cell.on').forEach(c=>c.classList.toggle('dim', ocultos.has(+c.dataset.ti))); };
  legend.appendChild(el);
});
// leyenda del PDF
const pleg = document.getElementById('pleg');
TRAMOS.forEach(t=>{
  const s = document.createElement('span');
  s.innerHTML = `<span class="sw" style="background:${t.p}"></span>${t.t}`;
  pleg.appendChild(s);
});

const grid = document.getElementById('grid');
let maxP = 0;
for(let m=1; m<=12; m++){
  const card = document.createElement('div');
  card.className = 'month';
  card.style.animationDelay = (0.32 + m*0.04) + 's';
  const dows = '<div class="dows">' + DOW.map((d,i)=>`<span class="${i>=5?'we':''}">${d}</span>`).join('') + '</div>';
  card.innerHTML = `<h2>${MESES[m-1].slice(0,3)}<span class="mt" id="mt-${m}"></span></h2>${dows}<div class="cells" id="c-${m}"></div>`;
  grid.appendChild(card);

  const cont = card.querySelector('.cells');
  const off = (new Date(2027, m-1, 1).getDay() + 6) % 7;
  for(let i=0;i<off;i++){ const q=document.createElement('div'); q.className='cell pad'; cont.appendChild(q); }

  let tot=0, n=0;
  Object.keys(P[m]).map(Number).sort((a,b)=>a-b).forEach(d=>{
    const precio = P[m][d];
    const ti = tramo(precio);
    const wd = (new Date(2027, m-1, d).getDay() + 6) % 7;
    const cel = document.createElement('div');
    cel.className = 'cell on' + (wd>=5?' we':'') + (FIJOS[m+'-'+d]?' fix':'') + (ti>=4?' hi':'');
    cel.dataset.ti = ti;
    cel.style.setProperty('--c', `var(${TRAMOS[ti].v})`);
    cel.style.setProperty('--pc', TRAMOS[ti].p);
    cel.title = `${d} de ${MESES[m-1]} · ${eur(precio)}` + (FIJOS[m+'-'+d] ? ' · fijado a mano' : '');
    cel.innerHTML = `<span class="d">${d}</span><span class="v">${mil(precio)}</span><span class="vp">${miles(precio)}</span>`;
    cont.appendChild(cel);
    tot += precio; n++;
    if(precio > maxP) maxP = precio;
  });
  document.getElementById('mt-'+m).textContent = mil(Math.round(tot/n/100)*100);
}

document.getElementById('s-base').textContent = eur(3800);
document.getElementById('s-max').textContent  = eur(maxP);
document.getElementById('s-nv').textContent   = eur(P[12][31]);
document.getElementById('pdf').onclick = () => window.print();
</script>
</body>
</html>
